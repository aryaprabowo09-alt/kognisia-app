name: Build Kognisia APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Clean Android Project (0 Ads)
        run: |
          mkdir -p android_app/app/src/main/java/id/my/kognisia/app
          mkdir -p android_app/app/src/main/res/layout
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/res/xml

          # 1. gradle.properties (WAJIB UNTUK ANDROIDX)
          cat << 'EOF' > android_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > android_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kognisia"
          include ':app'
          EOF

          # 3. root build.gradle
          cat << 'EOF' > android_app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.my.kognisia.app'
              compileSdk 34

              defaultConfig {
                  applicationId "id.my.kognisia.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          # 5. Generate Icon Resmi dari logo.jpg di Root Repositori
          python3 -m pip install --quiet Pillow
          cat << 'EOF' > generate_icons.py
          import os
          from PIL import Image, ImageDraw

          # Cari logo.jpg di root repositori
          candidates = ['logo.jpg', 'logo.png', 'assets/images/logo.jpg', 'assets/images/favicon.jpg']
          logo_path = None
          for c in candidates:
              if os.path.exists(c):
                  logo_path = c
                  break

          if not logo_path:
              raise FileNotFoundError("File logo.jpg tidak ditemukan di repositori!")

          print(f"Membuat icon dari file: {logo_path}")
          img = Image.open(logo_path).convert('RGBA')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          res_path = 'android_app/app/src/main/res'
          resample_method = getattr(Image, 'Resampling', Image).LANCZOS

          for folder, size in densities.items():
              dir_path = os.path.join(res_path, folder)
              os.makedirs(dir_path, exist_ok=True)

              # 1. Standard square launcher icon (ic_launcher.png)
              icon = img.resize((size, size), resample_method)
              icon.save(os.path.join(dir_path, 'ic_launcher.png'), 'PNG')

              # 2. Round launcher icon (ic_launcher_round.png)
              mask = Image.new('L', (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size, size), fill=255)
              round_icon = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              round_icon.paste(icon, (0, 0), mask=mask)
              round_icon.save(os.path.join(dir_path, 'ic_launcher_round.png'), 'PNG')

              # 3. Foreground for adaptive icon (108dp base)
              fg_size = int(size * 108 / 48)
              fg_img = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              inner_size = int(fg_size * 0.72)
              icon_inner = img.resize((inner_size, inner_size), resample_method)
              offset = (fg_size - inner_size) // 2
              fg_img.paste(icon_inner, (offset, offset))
              fg_img.save(os.path.join(dir_path, 'ic_launcher_foreground.png'), 'PNG')

          print("Semua icon resmi Kognisia (PNG Mipmap & Round) berhasil dibuat!")
          EOF
          python3 generate_icons.py

          # Adaptive Icon XML untuk Android 8.0+ (API 26+)
          mkdir -p android_app/app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > android_app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/white" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/white" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # 5.5 FileProvider Paths XML
          cat << 'EOF' > android_app/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_images" path="Pictures" />
          </paths>
          EOF

          # 6. AndroidManifest.xml (Izin Kamera, WebRTC, GPS, Notifikasi, Alarm Tepat Waktu, WakeLock, Boot)
          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <!-- Izin Kamera untuk Presensi Wajah & QR Scanner -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <!-- Izin Lokasi GPS untuk Geofencing Presensi -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <!-- Izin Berkas & Upload Dokumen/Foto -->
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28"
                  tools:ignore="ScopedStorage" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.location.gps"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Kognisia"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- FileProvider untuk menangani upload foto langsung dari kamera -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="id.my.kognisia.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <!-- Alarm & Boot Receivers -->
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 7. Values
          cat << 'EOF' > android_app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Kognisia</string>
              <string name="no_internet">Tidak ada koneksi internet</string>
              <string name="check_conn">Periksa jaringan internet Anda, lalu coba lagi.</string>
              <string name="retry">Coba Lagi</string>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/values/colors.xml
          <resources>
              <color name="primary">#0284C7</color>
              <color name="primary_dark">#0369A1</color>
              <color name="white">#FFFFFFFF</color>
              <color name="background">#F8FAFC</color>
              <color name="text_dark">#0F172A</color>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Kognisia" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
              </style>
          </resources>
          EOF

          # 8. Layout
          cat << 'EOF' > android_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="@style/Widget.AppCompat.ProgressBar.Horizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:layout_alignParentTop="true"
                  android:visibility="gone" />

              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefresh"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/progressBar">
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

              <LinearLayout
                  android:id="@+id/layoutError"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"

          EOF

          # 9. Java Files: AlarmReceiver, ScheduleHelper, BootReceiver, WebAppInterface, MainActivity
          
          # 9.1 WebAppInterface.java
          cat << 'EOF' > android_app/app/src/main/java/id/my/kognisia/app/WebAppInterface.java
          package id.my.kognisia.app;

          import android.content.Context;
          import android.content.Intent;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;

          public class WebAppInterface {
              private final Context context;

              public WebAppInterface(Context context) {
                  this.context = context;
              }

              @JavascriptInterface
              public void syncSchedule(String jsonSchedules) {
                  ScheduleHelper.saveAndSetAlarms(context, jsonSchedules);
              }

              @JavascriptInterface
              public void testAlarm() {
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  intent.putExtra("schedule_id", 99999);
                  intent.putExtra("subject_name", "Uji Coba Alarm Mengajar");
                  intent.putExtra("class_name", "Ruang Simulasi");
                  intent.putExtra("start_time", "Sekarang");
                  intent.putExtra("end_time", "Selesai");

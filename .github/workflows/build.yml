          # 9.5 MainActivity.java
          cat << 'EOF' > android_app/app/src/main/java/id/my/kognisia/app/MainActivity.java
          package id.my.kognisia.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import java.io.File;
          import java.io.IOException;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private static final String TARGET_URL = "https://kognisia.my.id/";
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
              private static final int REQ_PERMISSIONS_INITIAL = 1002;
              private static final int REQ_PERMISSIONS_CAMERA = 1003;
              private static final int REQ_PERMISSIONS_LOCATION = 1004;

              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefresh;
              private LinearLayout layoutError;
              private Button btnRetry;

              // File chooser & camera capture
              private ValueCallback<Uri[]> uploadMessage;
              private String mCameraPhotoPath;

              // WebRTC / HTML5 Media Permissions (Camera & Mic)
              private PermissionRequest pendingPermissionRequest;

              // Geolocation Callback
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  layoutError = findViewById(R.id.layoutError);
                  btnRetry = findViewById(R.id.btnRetry);

                  // Minta Izin esensial (Kamera, Lokasi GPS, Notifikasi) jika belum diberikan
                  checkAndRequestPermissions();

                  setupWebView();

                  swipeRefresh.setOnRefreshListener(() -> {
                      if (isNetworkAvailable()) webView.reload();
                      else swipeRefresh.setRefreshing(false);
                  });

                  btnRetry.setOnClickListener(v -> {
                      if (isNetworkAvailable()) {
                          layoutError.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          webView.reload();
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack();
                          else finish();
                      }
                  });

                  if (isNetworkAvailable()) {
                      webView.loadUrl(TARGET_URL);
                  } else {
                      webView.setVisibility(View.GONE);
                      layoutError.setVisibility(View.VISIBLE);
                  }
              }

              private void checkAndRequestPermissions() {
                  List<String> needed = new ArrayList<>();

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.CAMERA);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }

                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), REQ_PERMISSIONS_INITIAL);
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  // Penting untuk video streaming kamera tanpa interaksi user tambahan
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  // Dukungan Geolocation GPS di WebView
                  settings.setGeolocationEnabled(true);
                  settings.setGeolocationDatabasePath(getFilesDir().getPath());

                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setUserAgentString(settings.getUserAgentString() + " KognisiaApp/1.0");

                  // Registrasi WebAppInterface agar Website dapat sinkronisasi jadwal alarm ke HP
                  webView.addJavascriptInterface(new WebAppInterface(this), "KognisiaApp");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      try {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setMimeType(mimetype);
                          request.addRequestHeader("cookie", CookieManager.getInstance().getCookie(url));
                          request.setDescription("Mengunduh berkas...");
                          request.setTitle(URLUtil.guessFileName(url, contentDisposition, mimetype));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, contentDisposition, mimetype));
                          DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) dm.enqueue(request);
                          Toast.makeText(MainActivity.this, "Mengunduh berkas...", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://kognisia.my.id/")) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          return true;
                      }
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame()) {
                              webView.setVisibility(View.GONE);
                              layoutError.setVisibility(View.VISIBLE);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                      }

                      // Izin Kamera & Audio WebRTC (Presensi Wajah & Pemindai Barcode/QR)
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean requiresCamera = false;
                              for (String res : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) ||
                                      PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) {
                                      requiresCamera = true;
                                      break;
                                  }
                              }

                              if (requiresCamera) {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                                      request.grant(request.getResources());
                                  } else {
                                      pendingPermissionRequest = request;
                                      ActivityCompat.requestPermissions(MainActivity.this,
                                              new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO},
                                              REQ_PERMISSIONS_CAMERA);
                                  }
                              } else {
                                  request.grant(request.getResources());
                              }
                          });
                      }

                      @Override
                      public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingPermissionRequest != null && pendingPermissionRequest == request) {
                              pendingPermissionRequest = null;
                          }
                      }

                      // Izin Lokasi GPS untuk Geofencing Presensi
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoCallback = callback;
                              pendingGeoOrigin = origin;
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION},
                                      REQ_PERMISSIONS_LOCATION);
                          }
                      }

                      // File Chooser & Foto Langsung dari Kamera
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                          }
                          uploadMessage = filePathCallback;

                          Intent takePictureIntent = null;
                          try {
                              File photoFile = createImageFile();
                              if (photoFile != null) {
                                  Uri photoURI = FileProvider.getUriForFile(MainActivity.this,
                                          "id.my.kognisia.app.fileprovider", photoFile);
                                  takePictureIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  takePictureIntent.putExtra(MediaStore.EXTRA_OUTPUT, photoURI);
                              }
                          } catch (Exception ignored) {}

                          Intent contentSelectionIntent = fileChooserParams != null ? fileChooserParams.createIntent() : new Intent(Intent.ACTION_GET_CONTENT);
                          if (contentSelectionIntent.getType() == null) {
                              contentSelectionIntent.setType("*/*");
                          }

                          Intent[] intentArray = takePictureIntent != null ? new Intent[]{takePictureIntent} : new Intent[0];
                          Intent chooserIntent = new Intent(Intent.ACTION_CHOOSER);
                          chooserIntent.putExtra(Intent.EXTRA_INTENT, contentSelectionIntent);
                          chooserIntent.putExtra(Intent.EXTRA_TITLE, "Pilih Kamera atau Berkas");
                          chooserIntent.putExtra(Intent.EXTRA_INITIAL_INTENTS, intentArray);

                          try {
                              startActivityForResult(chooserIntent, FILE_CHOOSER_REQUEST_CODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });
              }

              private File createImageFile() throws IOException {
                  String timeStamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(new Date());
                  String imageFileName = "JPEG_" + timeStamp + "_";
                  File storageDir = getExternalFilesDir(Environment.DIRECTORY_PICTURES);
                  File image = File.createTempFile(imageFileName, ".jpg", storageDir);
                  mCameraPhotoPath = "file:" + image.getAbsolutePath();
                  return image;
              }

              private boolean isNetworkAvailable() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm != null) {
                      NetworkInfo info = cm.getActiveNetworkInfo();
                      return info != null && info.isConnected();
                  }
                  return false;
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (uploadMessage == null) return;

                      Uri[] results = null;
                      if (resultCode == RESULT_OK) {
                          if (data == null || data.getData() == null) {
                              if (mCameraPhotoPath != null) {
                                  results = new Uri[]{Uri.parse(mCameraPhotoPath)};
                              }
                          } else {
                              String dataString = data.getDataString();
                              if (dataString != null) {
                                  results = new Uri[]{Uri.parse(dataString)};
                              }
                          }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == REQ_PERMISSIONS_CAMERA) {
                      boolean granted = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                      if (granted) {
                          if (pendingPermissionRequest != null) {
                              pendingPermissionRequest.grant(pendingPermissionRequest.getResources());
                              pendingPermissionRequest = null;
                          }
                      } else {
                          if (pendingPermissionRequest != null) {
                              pendingPermissionRequest.deny();
                              pendingPermissionRequest = null;
                          }
                          Toast.makeText(this, "Izin kamera diperlukan untuk fitur presensi.", Toast.LENGTH_SHORT).show();
                      }
                  } else if (requestCode == REQ_PERMISSIONS_LOCATION) {
                      boolean granted = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      if (granted && pendingGeoCallback != null && pendingGeoOrigin != null) {
                          pendingGeoCallback.invoke(pendingGeoOrigin, true, false);
                      } else if (pendingGeoCallback != null && pendingGeoOrigin != null) {
                          pendingGeoCallback.invoke(pendingGeoOrigin, false, false);
                      }
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  } else if (requestCode == REQ_PERMISSIONS_INITIAL) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED && pendingPermissionRequest != null) {
                          pendingPermissionRequest.grant(pendingPermissionRequest.getResources());
                          pendingPermissionRequest = null;
                      }
                  }
              }
          }

      - name: Build APK with Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mv android_app/app/build/outputs/apk/debug/app-debug.apk Kognisia-v1.0.0.apk

      - name: Upload APK as Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Kognisia-APK-Tanpa-Iklan
          path: Kognisia-v1.0.0.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Kognisia-v1.0.0.apk
          tag_name: v1.0.0
          name: "Kognisia v1.0.0 (Official Release)"
          overwrite: true
          body: |
            ### Aplikasi Android Kognisia v1.0.0 (Bebas Iklan)
            Aplikasi resmi Kognisia untuk Guru dan Madrasah.

            - **URL Web:** https://kognisia.my.id/
            - **Status:** Bebas Iklan & Tanpa Watermark
